name: Jam Rust foundation — manual verification

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: 2

jobs:
  patched-server:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/work/build/jam-engine
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: repository
          persist-credentials: false
      - name: Verify and unpack prepared public source
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, zipfile
          p = pathlib.Path('repository/jam-foundation-source.zip')
          assert hashlib.sha256(p.read_bytes()).hexdigest() == 'de843f2fff474c1c0afafee3d32d8636c133dfbede185bb37a442e8561ae8409'
          with zipfile.ZipFile(p) as z:
              for n in z.namelist():
                  q = pathlib.PurePosixPath(n)
                  assert not q.is_absolute() and '..' not in q.parts and q.parts[0] == 'server'
              z.extractall('.')
          PY
      - name: Checkout separate pinned engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Pumpkin-MC/Pumpkin
          ref: ff873cbbb8cc8fe591fb09aaf7d70b30517a57d0
          path: work/jam-engine
          persist-credentials: false
      - name: Install project Rust toolchain
        shell: bash
        run: |
          version="$(python3 -c 'import json; print(json.load(open("server/upstream.lock.json"))["toolchain"]["rust"])')"
          rustup toolchain install "$version" --profile minimal
          rustup default "$version"
      - name: Validate and apply source overlay
        run: python3 server/scripts/prepare-jam-engine.py --engine work/jam-engine --apply --report outputs/server/jam-foundation/core-overlay-report.json
      - name: Test signed forwarding parser
        run: cargo test --locked --manifest-path work/jam-engine/Cargo.toml -p pumpkin-core --lib net::proxy::velocity::tests
      - name: Build patched Rust server
        run: cargo build --locked --release --manifest-path work/jam-engine/Cargo.toml -p pumpkin
      - name: Test isolated login protocol
        shell: bash
        run: |
          binary="$CARGO_TARGET_DIR/release/pumpkin"
          digest="$(sha256sum "$binary" | cut -d ' ' -f1)"
          python3 server/tests/jam_proxy_forwarding.py --binary "$binary" --sha256 "$digest"
      - name: Upload foundation binary and evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: jam-patched-server-foundation
          path: |
            outputs/server/jam-foundation/
            outputs/server/jam-proxy/
            work/build/jam-engine/release/pumpkin
          if-no-files-found: warn
          retention-days: 14

  proxy-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/work/build/jam-proxy
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: repository
          persist-credentials: false
      - name: Verify and unpack prepared public source
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, zipfile
          p = pathlib.Path('repository/jam-foundation-source.zip')
          assert hashlib.sha256(p.read_bytes()).hexdigest() == 'de843f2fff474c1c0afafee3d32d8636c133dfbede185bb37a442e8561ae8409'
          with zipfile.ZipFile(p) as z:
              for n in z.namelist():
                  q = pathlib.PurePosixPath(n)
                  assert not q.is_absolute() and '..' not in q.parts and q.parts[0] == 'server'
              z.extractall('.')
          PY
      - name: Checkout pinned Rust proxy candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Shadowner/Infrarust
          ref: 64f7da31bf308bcf0d0b8ce40935607a0d476cdb
          path: work/jam-proxy
          persist-credentials: false
      - name: Install project Rust toolchain
        shell: bash
        run: |
          version="$(python3 -c 'import json; print(json.load(open("server/upstream.lock.json"))["toolchain"]["rust"])')"
          rustup toolchain install "$version" --profile minimal
          rustup default "$version"
      - name: Check candidate workspace
        run: cargo check --locked --manifest-path work/jam-proxy/Cargo.toml --workspace
      - name: Build candidate binary
        run: cargo build --locked --release --manifest-path work/jam-proxy/Cargo.toml -p infrarust
      - name: Upload candidate binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: jam-proxy-candidate-only
          path: work/build/jam-proxy/release/infrarust
          if-no-files-found: error
          retention-days: 14
