name: Verify downloaded server builds

on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Build workflow run ID
        required: true
        default: '40830602979'
        type: string

permissions:
  contents: read
  actions: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: linux-x64
          - os: windows-latest
            label: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download completed build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: horizon-rust-${{ matrix.label }}
          path: input
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
      - name: Start server, verify plugin, restart and invalid inputs
        run: python runtime_smoke.py
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: runtime-verification-${{ matrix.label }}
          path: outputs/smoke/
          if-no-files-found: error
          retention-days: 14
